[package]
name = "nanorod"
version = "1.0.0"
edition = "2024"

[features]
default = ["gpu"]
gpu = ["dep:cudarc"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
csv = "1.4"
cudarc = { version = "0.19", default-features = false, features = [
  "std",
  "driver",
  "nvrtc",
  "dynamic-loading",
  "cuda-12020",
], optional = true }
eframe = { version = "0.35", default-features = false, features = [
  "default_fonts",
  "glow",
  "wayland",
  "x11",
] }
egui = "0.35"
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
